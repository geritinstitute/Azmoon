<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون زیست‌شناسی — کانون گریت</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: #0b1120;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px 16px;
    line-height: 1.9;
    user-select: none;
    -webkit-user-select: none;
  }
  .container { max-width: 720px; margin: 0 auto; }

  #loginScreen { display: block; }
  #examScreen { display: none; }

  h1 { font-size: 22px; text-align: center; color: #38bdf8; margin-bottom: 6px; }
  .sub { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 26px; }

  .card {
    background: linear-gradient(160deg, #1e293b, #0f172a);
    border-radius: 16px;
    padding: 26px 22px;
    margin-bottom: 24px;
    border: 1px solid #2d3b4f;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #475569; background: #0b1120; color: #fff;
    font-size: 15px; outline: none; font-family: inherit;
  }
  .field input:focus { border-color: #38bdf8; }

  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(145deg, #38bdf8, #0ea5e9);
    color: #0b1120; font-weight: bold; font-size: 15px;
    cursor: pointer; font-family: inherit; margin-top: 10px;
    transition: transform .1s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .msg { text-align: center; color: #f87171; font-size: 13px; min-height: 1.5em; margin-top: 10px; }

  .exam-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
    padding-bottom: 16px; margin-bottom: 20px;
    border-bottom: 1px solid #2d3b4f;
  }
  .exam-header .info { font-size: 13px; color: #94a3b8; }
  .exam-header .info b { color: #38bdf8; }
  .timer {
    background: #0b1120; padding: 8px 16px; border-radius: 10px;
    font-family: 'Courier New', monospace; font-size: 18px;
    font-weight: bold; color: #6ee7b7; border: 1px solid #2d3b4f;
  }
  .timer.warn { color: #f87171; border-color: #f87171; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  .question {
    margin-bottom: 24px; padding-bottom: 20px;
    border-bottom: 1px dashed #2d3b4f;
  }
  .question:last-of-type { border-bottom: none; }
  .q-num { color: #38bdf8; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
  .q-text { font-size: 15px; margin-bottom: 12px; white-space: pre-line; }

  .option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; margin-bottom: 8px;
    background: #0b1120; border: 1px solid #2d3b4f;
    border-radius: 10px; cursor: pointer; transition: all .15s;
    font-size: 14px;
  }
  .option:hover { border-color: #38bdf8; }
  .option input { margin-top: 4px; accent-color: #38bdf8; cursor: pointer; }
  .option.selected { background: #0c2a3d; border-color: #38bdf8; }

  .text-input {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #475569; background: #0b1120; color: #fff;
    font-size: 15px; outline: none; font-family: inherit;
  }
  .text-input:focus { border-color: #38bdf8; }

  .submit-btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    background: linear-gradient(145deg, #10b981, #059669);
    color: #fff; font-weight: bold; font-size: 16px;
    cursor: pointer; font-family: inherit; margin-top: 10px;
  }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

  .success { text-align: center; padding: 40px 20px; }
  .success .icon { font-size: 60px; margin-bottom: 16px; }
  .success h2 { color: #6ee7b7; font-size: 22px; margin-bottom: 10px; }
  .success p { color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>

<div class="container">

  <!-- ===== LOGIN ===== -->
  <div id="loginScreen">
    <h1>🧬 آزمون زیست‌شناسی</h1>
    <p class="sub">کانون انتشارات گریت</p>
    <div class="card">
      <div class="field">
        <label>نام و نام خانوادگی</label>
        <input id="inpName" placeholder="مثلاً: علی محمدی" autocomplete="off">
      </div>
      <div class="field">
        <label>کلاس / مدرسه</label>
        <input id="inpClass" placeholder="مثلاً: دهم تجربی — دبیرستان شهید بهشتی" autocomplete="off">
      </div>
      <button class="btn" id="startBtn">شروع آزمون</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- ===== EXAM ===== -->
  <div id="examScreen">
    <div class="card">
      <div class="exam-header">
        <div class="info">
          👤 <b id="hdrName"></b><br>
          <span id="hdrClass"></span>
        </div>
        <div class="timer" id="timer">11:00</div>
      </div>
      <div id="questionsBox"></div>
      <button class="submit-btn" id="submitBtn">📤 ارسال پاسخ‌ها</button>
      <div class="msg" id="examMsg"></div>
    </div>
  </div>

  <!-- ===== SUCCESS ===== -->
  <div id="successScreen" class="success" style="display:none">
    <div class="icon">✅</div>
    <h2>پاسخ‌های شما ثبت شد</h2>
    <p>آزمون به پایان رسید. نتیجه توسط دبیر اعلام می‌شود.</p>
  </div>

</div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const NPOINT_URL = 'https://api.npoint.io/4e808f937112b7c22019';
const EXAM_DURATION_MIN = 11;

// ============================================================
//  QUESTIONS
// ============================================================
const QUESTIONS = [
  {
    type: 'mc',
    text: "امروزه ...... همانند ........ در محدوده علم زیست‌شناسی بررسی می‌شود.",
    options: [
      "چگونگی ورود آمیب مغزخوار به مغز / چگونگی مرگ انسان توسط آمیب آدم‌مغزی",
      "تشخیص خوش‌طعم بودن شیر / تشخیص هویت انسان‌ها به کمک اثر انگشت",
      "شناسایی یاخته‌هایی با تقسیم بی‌رویه و سریع و یافتن روشی برای نابود کردن آن‌ها / نحوه چگونگی استفاده متا آمفتامین"
    ]
  },
  {
    type: 'mc',
    text: "کدام یک از ویژگی‌های زیر در مورد حشره‌ای که پروکاریوت نیست درست است؟ (طبق کتاب درسی)",
    options: [
      "این حشره می‌تواند مکزیک تا جنوب کانادا را طی کند",
      "این حشره سالانه به همراه جمعیت خود مهاجرت می‌کند",
      "این ناپروکاریوت می‌تواند بخشی از زندگی خود را بر روی درختان سپری کند",
      "یاخته‌های عصبی پشتیبان در جهت‌یابی این حشره نقش دارند"
    ]
  },
  {
    type: 'text',
    text: "پروکاریوت‌ها در مرحله‌ای که یوکاریوت‌ها توانایی دیدن زیست‌کره را ندارند، همچنین هنوز پوستی ندارند اما اجتماع دارند، می‌توانند به زندگی خود ادامه دهند. این مرحله چه مرحله‌ای است؟ (پاسخ عددی وارد کنید)"
  },
  {
    type: 'text',
    text: "فعالیت بیشتر تارکشنده برخلاف رنگ خرس قطبی چه نام دارد؟ (پاسخ را وارد کنید)"
  },
  {
    type: 'mc',
    text: "زیست‌شناسی در کدام یک از موارد زیر به کار نرفته است؟",
    options: [
      "پزشکی",
      "دندانپزشکی",
      "جنگ‌های سال ۲۵۰۰ سال قبل از میلاد",
      "در ساخت بمب‌افکن استراتژیک و رادارگریز"
    ]
  },
  {
    type: 'mc',
    text: "گذرندگی اسمز تقریبی یاخته چند است؟",
    options: ["۰.۹", "۲", "۱", "۰.۴"]
  },
  {
    type: 'mc',
    text: "هنگامی که غذا در روده عبور می‌کند چند لایه از سلول‌ها را با خود می‌کند؟",
    options: ["صفر", "۴", "۳", "تقریباً ۵ الی ۱۰"]
  },
  {
    type: 'mc',
    text: "بافت پیوندی سست بافتی است که در اطراف بافت‌های دیگر دیده می‌شود. طبق کتاب درسی در اطراف کجا دیده می‌شود؟",
    options: [
      "رشته‌های کلاژن",
      "بافت چربی",
      "یاخته‌های دوکی شکل",
      "بافت پیوندی متراکم"
    ]
  },
  {
    type: 'mc',
    text: "کدام گزینه برای تکمیل عبارت مقابل مناسب است؟\n«وجه تمایز سطحی از حیات که نقطه‌چین ... با سطحی بلافاصله قبل از آن نقطه‌چین ... است.»",
    options: [
      "برای اولین بار همکاری اجزا در آن مشاهده می‌شود / تعداد جانداران واحد ویژگی‌های حیات",
      "آخرین سطح قبل از به وجود آمدن جانور حساب می‌شود / داشتن بیش از یک نوع بافت",
      "بالاترین سطح واجد جانداران با پراکندگی مشابه محسوب می‌شود / تعداد اقلیم‌های متفاوت در محل زندگی جانوران",
      "برای اولین بار تحت تأثیر عوامل فاقد مولکول‌های زیستی قرار می‌گیرد / تعداد گونه‌های جانوری در حال زیستن در یک زمان منطقه بوم‌سازگان"
    ]
  },
  {
    type: 'mc',
    text: "کدام گزینه نادرست است؟",
    options: [
      "بافت ماهیچه صاف دوکی شکل هستند",
      "بافت ماهیچه صاف دوکی شکل منتظم نیستند",
      "هنگامی که پیام از مغز وارد جسم دارینه‌ها می‌شود، وارد جسم یاخته‌ای سپس وارد آکسون و سپس به محل مورد نظر می‌رود"
    ]
  }
];

// ============================================================
//  STATE
// ============================================================
let studentName = '';
let studentClass = '';
let answers = {};
let timeLeft = EXAM_DURATION_MIN * 60;
let timerInterval = null;
let startTime = null;
let submitted = false;

// ============================================================
//  LOGIN
// ============================================================
document.getElementById('startBtn').onclick = () => {
  const name = document.getElementById('inpName').value.trim();
  const cls = document.getElementById('inpClass').value.trim();
  const msg = document.getElementById('loginMsg');
  if (!name || !cls) {
    msg.textContent = 'لطفاً نام و کلاس را وارد کنید';
    return;
  }
  studentName = name;
  studentClass = cls;
  document.getElementById('hdrName').textContent = name;
  document.getElementById('hdrClass').textContent = cls;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  renderQuestions();
  startTimer();
};

// ============================================================
//  RENDER QUESTIONS
// ============================================================
function renderQuestions() {
  const box = document.getElementById('questionsBox');
  box.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = `سوال ${qi + 1}`;
    div.appendChild(num);

    const txt = document.createElement('div');
    txt.className = 'q-text';
    txt.textContent = q.text;
    div.appendChild(txt);

    if (q.type === 'mc') {
      q.options.forEach((opt) => {
        const label = document.createElement('label');
        label.className = 'option';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `q${qi}`;
        radio.value = opt;
        radio.addEventListener('change', () => {
          answers[qi] = opt;
          div.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          label.classList.add('selected');
        });
        const span = document.createElement('span');
        span.textContent = opt;
        label.appendChild(radio);
        label.appendChild(span);
        div.appendChild(label);
      });
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-input';
      input.placeholder = 'پاسخ خود را وارد کنید...';
      input.addEventListener('input', () => {
        answers[qi] = input.value.trim() || null;
      });
      div.appendChild(input);
    }

    box.appendChild(div);
  });
}

// ============================================================
//  TIMER
// ============================================================
function startTimer() {
  startTime = Date.now();
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam(true);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (timeLeft <= 60) el.classList.add('warn');
}

// ============================================================
//  SUBMIT
// ============================================================
document.getElementById('submitBtn').onclick = () => submitExam(false);

async function submitExam(auto) {
  if (submitted) return;

  if (!auto) {
    const unanswered = QUESTIONS.length - Object.keys(answers).filter(k => answers[k]).length;
    if (unanswered > 0) {
      if (!confirm(`${unanswered} سوال بی‌پاسخ مانده است. باز هم ارسال می‌کنید؟`)) return;
    } else {
      if (!confirm('آیا از ارسال پاسخ‌ها مطمئن هستید؟')) return;
    }
  }

  submitted = true;
  clearInterval(timerInterval);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ارسال...';
  document.getElementById('examMsg').textContent = '';

  const timeSpentSec = Math.floor((Date.now() - startTime) / 1000);
  const timeSpent = `${String(Math.floor(timeSpentSec/60)).padStart(2,'0')}:${String(timeSpentSec%60).padStart(2,'0')}`;

  const answerObj = {};
  QUESTIONS.forEach((q, qi) => {
    answerObj[`q${qi + 1}`] = answers[qi] || null;
  });

  const submissionKey = `${studentName}_${studentClass}_${Date.now()}`;
  const submission = {
    name: studentName,
    class: studentClass,
    answers: answerObj,
    submittedAt: new Date().toISOString(),
    timeSpent: timeSpent,
    autoSubmitted: auto
  };

  try {
    const getRes = await fetch(NPOINT_URL + '?t=' + Date.now());
    let data = await getRes.json();
    if (!data || typeof data !== 'object') data = {};
    if (!data.submissions) data.submissions = {};
    data.submissions[submissionKey] = submission;

    const postRes = await fetch(NPOINT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (!postRes.ok) throw new Error('POST failed');
  } catch (e) {}

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';
}

// ============================================================
//  ANTI-CHEAT
// ============================================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
</script>
</body>
 </html>
